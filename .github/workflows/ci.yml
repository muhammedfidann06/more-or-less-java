name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: more-or-less-jar
          path: target/more-or-less-*.jar
      # Live-Version im Browser: web/index.html (gleiche Regeln wie Game.java) + die JAR zum Herunterladen
      - name: Build site
        run: |
          mkdir -p public
          cp web/index.html public/
          cp target/more-or-less-*.jar public/more-or-less.jar
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
